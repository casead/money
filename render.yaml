services:
  - type: web
    name: moneyrecord-api
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"
      - key: ASPNETCORE_SUPPRESSSTATUSMESSAGES
        value: "true"
      - key: ConnectionStrings__MoneyRecord
        sync: false
      - key: MongoDb__DatabaseName
        value: moneyrecord
      - key: Jwt__SigningKey
        sync: false
      - key: Jwt__Issuer
        value: MoneyRecord
      - key: Jwt__Audience
        value: MoneyRecordApp
      - key: Jwt__AccessTokenMinutes
        value: 15
      - key: Jwt__RefreshTokenDays
        value: 7
    healthCheckPath: /health
    autoDeploy: true
